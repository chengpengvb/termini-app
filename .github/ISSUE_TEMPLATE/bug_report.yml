name: Bug report
description: Report a bug in Termini
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where did the issue happen?
      options:
        - Windows
        - macOS
        - iOS
        - Linux
        - Android
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: App version shown in the client.
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the problem?
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste logs or drag screenshots if available.
    validations:
      required: false
